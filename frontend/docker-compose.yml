services:
    frontend:
        build:
            context: .
            dockerfile: docker/Dockerfile
            target: dev  # change to 'prod' for production
        environment:
            VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
        ports:
            - "3000:5173"
        healthcheck:
            test: ["CMD-SHELL", "wget -q --spider http://localhost:5173/ || exit 1"]
            interval: 1m
            timeout: 5s
            retries: 2
            start_period: 15s
        restart: unless-stopped
