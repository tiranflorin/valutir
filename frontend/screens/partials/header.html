<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
    <link rel="alternate icon" href="../images/favicon.ico">
    <style>
        *{box-sizing:border-box}html,body{margin:0;background:#fff;color:#19251e;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}a{text-decoration:none;color:inherit}.top{height:76px;background:#fff;border-bottom:1px solid #e4ebe6;padding:0 max(24px,calc((100% - 1280px)/2));display:flex;align-items:center;justify-content:space-between;gap:22px}.brand{display:inline-flex;align-items:center;flex:0 0 auto;line-height:0}.brand img{display:block;width:128px;height:auto}.right{display:flex;align-items:center;gap:20px}.nav{display:flex;align-items:center;gap:7px}.nav a{font-size:12px;color:#68766e;padding:8px 9px;border-radius:8px}.nav a.active{color:#1f6841;background:#edf6ef;font-weight:750}.account-menu{position:relative}.account-menu summary{position:relative;list-style:none;cursor:pointer}.account-menu summary::-webkit-details-marker{display:none}.avatar{width:34px;height:34px;border:0;border-radius:50%;background:#e7f2ea;color:#285f3c;display:grid;place-items:center;font-family:inherit;font-size:12px;font-weight:800}.account-menu summary::after{content:"⌄";position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border:1px solid #fff;border-radius:50%;background:#dcece0;color:#3c684a;display:grid;place-items:center;font-size:10px;line-height:1}.account-menu[open] .avatar{outline:2px solid #cfe4d4;outline-offset:2px}.account-popover{position:absolute;z-index:20;right:0;top:calc(100% + 12px);width:196px;padding:6px;background:#fff;border:1px solid #e2e9e4;border-radius:11px;box-shadow:0 12px 30px #1e36261c}.account-popover a{display:flex;align-items:center;padding:10px;border-radius:7px;color:#43554a;font-size:12px}.account-popover a:hover{background:#f2f7f3;color:#1f6841}.account-popover .logout{margin-top:4px;border-top:1px solid #edf1ee;border-radius:0 0 7px 7px;color:#8c514b}.visitor .nav{gap:16px}.visitor .nav a{padding:7px 0}.visitor .nav a.active{background:none}.visitor .nav .cta{padding:10px 13px;border-radius:8px;background:#1c7045;color:white;font-weight:800}.visitor .nav .signin{font-weight:700;color:#33473b}.is-hidden{display:none!important}
        @media(max-width:800px){.top{padding:0 16px;gap:10px}.brand img{width:116px}.right{gap:9px}.nav{gap:2px}.nav a{font-size:11px;padding:7px 6px}.visitor .nav{gap:10px}.visitor .nav a:not(.signin):not(.cta){display:none}}
        @media(max-width:480px){.top{height:68px;padding:0 12px}.brand img{width:104px}.right{gap:6px}.nav a[data-compact-hide="true"]{display:none}.avatar{width:30px;height:30px}.account-popover{width:184px}.visitor .nav{gap:10px}.visitor .nav .signin{font-size:11px}}
    </style>
</head>
<body>
<header class="top" id="topbar">
    <a class="brand" id="brand" href="../1 public-homepage.html" target="_top"><img src="../images/header-logo.svg" alt="ValuTir"></a>
    <div class="right">
        <nav class="nav" id="member-nav" aria-label="Account navigation">
            <a data-page="subscriptions" href="../3 personal-dashboard-with-business-switch.html" target="_top">Subs</a>
            <a data-page="calendar" data-compact-hide="true" href="../11 personal-calendar.html" target="_top">Calendar</a>
            <details class="account-menu">
                <summary class="avatar" aria-label="Open account menu">F</summary>
                <nav class="account-popover" aria-label="Account menu">
                    <a href="../13 personal-profile-currency.html#profile" target="_top">Profile</a>
                    <a href="../13 personal-profile-currency.html#preferences" target="_top">Preferences</a>
                    <a class="logout" href="../1 public-homepage.html" target="_top">Log out</a>
                </nav>
            </details>
        </nav>
        <nav class="nav" id="visitor-nav" aria-label="Site navigation">
            <a data-page="how" href="../1 public-homepage.html#how-it-works" target="_top">How it works</a>
            <a data-page="business" href="../1 public-homepage.html#business" target="_top">For business</a>
            <a data-page="free" href="../1 public-homepage.html#free" target="_top">Free plan</a>
            <a class="signin" href="/login" target="_top">Sign in</a>
            <a class="cta" href="/register" target="_top">Try it out</a>
        </nav>
    </div>
</header>
<script>
    const params=new URLSearchParams(location.search);
    const mode=params.get('mode')||'member';
    const active=params.get('active')||'subscriptions';
    const visitor=mode==='visitor';
    document.body.classList.toggle('visitor',visitor);
    document.querySelector('#member-nav').classList.toggle('is-hidden',visitor);
    document.querySelector('#visitor-nav').classList.toggle('is-hidden',!visitor);
    document.querySelector('#brand').href=visitor?'../1 public-homepage.html':'../3 personal-dashboard-with-business-switch.html';
    document.querySelectorAll('#member-nav [data-page]').forEach(a=>a.classList.toggle('active',a.dataset.page===active));
    document.querySelectorAll('#visitor-nav [data-page]').forEach(a=>a.classList.toggle('active',a.dataset.page===active));
    if(params.get('context')==='business')document.querySelector('#member-nav [data-page="subscriptions"]').href='../4 business-dashboard-switch.html';
</script>
</body>
</html>
