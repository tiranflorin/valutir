# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    # Every limiter locks its counter while it updates it (app.rate_limiter.lock_factory, services.yaml).
    rate_limiter:
        password_reset_request:
            policy: fixed_window
            lock_factory: app.rate_limiter.lock_factory
            limit: 5
            interval: '15 minutes'
        password_reset_submit:
            policy: fixed_window
            lock_factory: app.rate_limiter.lock_factory
            limit: 10
            interval: '15 minutes'
        registration:
            policy: fixed_window
            lock_factory: app.rate_limiter.lock_factory
            limit: 5
            interval: '15 minutes'
        account_password_check:
            policy: fixed_window
            lock_factory: app.rate_limiter.lock_factory
            limit: 5
            interval: '15 minutes'
        email_change_confirm:
            policy: fixed_window
            lock_factory: app.rate_limiter.lock_factory
            limit: 10
            interval: '15 minutes'
        contact_submit:
            policy: fixed_window
            lock_factory: app.rate_limiter.lock_factory
            limit: 5
            interval: '15 minutes'
        # Verification links opened, per client IP (guessing a 256-bit token is hopeless; this caps noise).
        email_verification_confirm:
            policy: fixed_window
            lock_factory: app.rate_limiter.lock_factory
            limit: 10
            interval: '15 minutes'
        # "Resend confirmation link", per user: each one sends an email.
        email_verification_resend:
            policy: fixed_window
            lock_factory: app.rate_limiter.lock_factory
            limit: 3
            interval: '1 hour'
        # Each attempt creates a Stripe Checkout session; per user.
        billing_checkout:
            policy: fixed_window
            lock_factory: app.rate_limiter.lock_factory
            limit: 10
            interval: '1 hour'
        # "Download my data" (JSON and CSV together); each one reads every row the user has. Per user.
        account_export:
            policy: fixed_window
            lock_factory: app.rate_limiter.lock_factory
            limit: 10
            interval: '1 hour'
    secret: '%env(APP_SECRET)%'

    # Real client IPs behind a reverse proxy (Cloudflare, a load balancer, a tunnel). Rate limits,
    # login throttling and Turnstile use Request::getClientIp(), which is the proxy's own address
    # unless that proxy is trusted. SYMFONY_TRUSTED_PROXIES lists the addresses/CIDRs allowed to set
    # these headers (see docs/cloudflare-and-proxies.md); unset, no proxy is trusted, so
    # forwarded headers are ignored. X-Forwarded-Host is deliberately not trusted.
    trusted_proxies: '%env(default::SYMFONY_TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-port']

    # No sessions: the API is stateless (JWT bearer tokens, stateless firewalls), so nothing ever
    # needs server-side session state or a session cookie. Off, so no future change can start one
    # by accident (docs/status-and-todo.md, TODO #5).
    session: false

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
