lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    token_ttl: 86400  # 24 hours in seconds
    # Single-device logout (POST /api/logout) stores revoked token IDs until they expire.
    # The pool is PostgreSQL-backed (see cache.yaml) so revocations survive deploys and are
    # shared by every backend instance.
    blocklist_token:
        enabled: true
        cache: cache.jwt_blocklist
