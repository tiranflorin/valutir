; Production PHP settings, on top of php.ini-production (prod image only).

; The code in the image never changes, so OPcache never needs to check files for updates.
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; One t4g.small (2 GB) runs this container plus cloudflared; keep a single request well below that.
memory_limit = 256M
