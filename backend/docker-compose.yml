# Docker Compose - Backend (valutir/backend/)
services:
    db:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: valutir
            POSTGRES_USER: valutir
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U valutir"]
            interval: 5s
            timeout: 5s
            retries: 5
        ports:
            - "${DB_PORT:-5432}:5432"
        restart: unless-stopped

    maildev:
        image: 'maildev/maildev'
        ports:
            - '1080:1080'
            - '1025:1025'
        restart: unless-stopped

    backend:
        build:
            context: .
            dockerfile: docker/Dockerfile
        environment:
            DATABASE_URL: 'postgresql://valutir:${DB_PASSWORD}@db:5432/valutir'
            JWT_SECRET_KEY: "%kernel.project_dir%/config/jwt/private.pem"
            JWT_PUBLIC_KEY: "%kernel.project_dir%/config/jwt/public.pem"
            JWT_PASSPHRASE: ${JWT_PASSPHRASE}
            APP_DEBUG: "1"
            MAILER_DSN: smtp://maildev:1025
            CONTACT_RECIPIENT: ${CONTACT_RECIPIENT:-}
            TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
            TURNSTILE_ALLOWED_HOSTNAMES: ${TURNSTILE_ALLOWED_HOSTNAMES:-}
            STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
            STRIPE_MODE: ${STRIPE_MODE:-test}
            STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
            STRIPE_AUTOMATIC_TAX: ${STRIPE_AUTOMATIC_TAX:-1}
            PHP_IDE_CONFIG: ${PHP_IDE_CONFIG:-serverName=valutir-backend}
        volumes:
            - .:/var/www/html
#            - /var/www/html/vendor
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            db:
                condition: service_healthy
            maildev:
                condition: service_started
        ports:
            - "${BE_PORT:-8080}:8080"
        healthcheck:
            test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1" ]  # IPv4: localhost is ::1 here; / is a 404
            interval: 1m
            timeout: 5s
            retries: 2
            start_period: 15s
        restart: unless-stopped

    # Local payments only: forwards Stripe test-mode webhooks to the backend (README "Payments").
    # Start it with: docker compose --profile stripe up -d stripe-cli
    stripe-cli:
        image: stripe/stripe-cli:v1.21.8
        profiles: [stripe]
        command: listen --forward-to http://backend:8080/api/billing/webhook --events checkout.session.completed,checkout.session.async_payment_succeeded,checkout.session.async_payment_failed,checkout.session.expired,charge.refunded,charge.dispute.created
        environment:
            STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}
        depends_on:
            - backend

volumes:
    pgdata:
